            <main>
        <section class="sponsor-banner-slot" data-banner-slot="vivo" hidden></section>
        <section class="live-room">
          
          <!-- PLAYER DINÁMICO -->
          <div class="player-frame live-player-frame" id="live-player">
            <div id="youtube-live">
              <p style="color:#aaa; text-align:center; padding-top:100px;">Buscando transmisión en vivo...</p>
            </div>
          </div>

          <!-- CHAT -->
          <aside class="chat-panel" id="live-chat">
            <h2>Chat del Vivo</h2>
            <div id="chat-container" style="flex:1; min-height:200px; background:#111; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
              <div id="chat-offline-msg" style="text-align:center; padding:32px 20px; color:#666;">
                <p style="font-size:1rem; margin:0 0 8px;">💬</p>
                <p style="margin:0 0 6px; color:#888;">El chat estará disponible<br>cuando comience una transmisión en vivo.</p>
                <small style="color:#555;">Sincronizado con YouTube</small>
              </div>
              <iframe id="youtube-chat"
                      width="100%"
                      height="100%"
                      frameborder="0"
                      style="border:none; display:none;">
              </iframe>
            </div>
          </aside>

        </section>
      </main>
    </div>
